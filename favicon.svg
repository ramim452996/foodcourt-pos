<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fcGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FEF08A"/>
            <stop offset="50%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>
        <linearGradient id="fcEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="50%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="fcDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="50%" stop-color="#064E3B"/>
            <stop offset="100%" stop-color="#022C22"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- Rounded Squircle Base with Gold Edge -->
    <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#fcDarkBg)" stroke="url(#fcGold)" stroke-width="3" />
    
    <!-- Outer Cloche / Luxury Food Dome Arc -->
    <path d="M26 78C26 52 42 36 64 36C86 36 102 52 102 78H26Z" fill="url(#fcEmerald)" fill-opacity="0.35" stroke="url(#fcGold)" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Cloche Handle / Royal Crown Finial -->
    <circle cx="64" cy="27" r="7" fill="url(#fcGold)" filter="url(#glow)"/>
    <path d="M64 17V21" stroke="url(#fcGold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M57 23H71" stroke="url(#fcGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Burger / Platter Details in Center -->
    <path d="M38 78C38 72 48 68 64 68C80 68 90 72 90 78" stroke="#FEF08A" stroke-width="4" stroke-linecap="round"/>
    <!-- Fresh Leaf / Emerald Sparkle -->
    <path d="M50 56C56 50 72 50 78 56" stroke="url(#fcEmerald)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Base Food Plate Line -->
    <path d="M20 94C42 98 86 98 108 94" stroke="url(#fcGold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 103C48 106 80 106 96 103" stroke="url(#fcEmerald)" stroke-width="4" stroke-linecap="round"/>
</svg>